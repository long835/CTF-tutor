[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-tutor"
version = "0.4.2"
description = "Local-first CTF learning assistant — investigate, hypothesize, teach (not a solver)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CTF-Tutor contributors" }]
keywords = ["ctf", "security", "education", "agent", "tutor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.28",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
vector = ["chromadb>=0.4"]
ingest = ["youtube-transcript-api>=0.6", "yt-dlp>=2023.1"]
full = ["chromadb>=0.4", "youtube-transcript-api>=0.6", "yt-dlp>=2023.1"]

[project.scripts]
ctf-tutor = "main:main"

[project.urls]
Homepage = "https://github.com/long835/CTF-tutor"
Repository = "https://github.com/long835/CTF-tutor"

[tool.setuptools]
py-modules = [
  "main",
  "classifier",
  "config",
  "concurrency",
  "decomposer",
  "depth_guide",
  "eval",
  "explainer",
  "history",
  "ingest",
  "llm_client",
  "multilang",
  "progress",
  "retriever",
  "schema",
  "synthesizer",
  "chat_generate",
  "archive_quality",
]
packages = ["agent", "tools", "plugins"]

[tool.setuptools.package-data]
agent = ["py.typed"]

[tool.setuptools.data-files]
"share/ctf-tutor/data" = [
  "data/technique_library.json",
  "data/technique_vocab.json",
  "data/provenance.json",
]
"share/ctf-tutor/data/eval" = [
  "data/eval/ground_truth.json",
  "data/eval/independent_public_style.json",
  "data/eval/adversarial.json",
  "data/eval/public_contest_grounded.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
