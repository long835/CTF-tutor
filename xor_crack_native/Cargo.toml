[package]
name = "xor_crack_native"
version = "0.1.0"
edition = "2021"
description = "Repeating-key XOR cracker, native extension for CTF-tutor's tools/xor_crack.py"
license = "MIT"
publish = false

# cdylib: built as a Python-loadable shared library (.so/.pyd), the shape
# maturin expects. rlib is also emitted so `cargo test` can build/run the
# unit tests in src/lib.rs directly, without going through Python at all.
[lib]
name = "xor_crack_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 0.19 pins to the pre-`Bound<T>` pyo3 API (`&PyModule`, `Python<'_>`
# passed by value) that src/lib.rs is written against -- bumping to 0.20+
# would need the module init function and PyBytes calls updated to the
# Bound<'py, T> smart-pointer API first.
pyo3 = { version = "0.19", features = ["extension-module"] }

[profile.release]
# This crate exists specifically for the CPU-bound 256-way-per-column
# search (see src/lib.rs); it's worth spending extra build time for the
# resulting speedup relative to the pure-Python fallback.
opt-level = 3
lto = true
