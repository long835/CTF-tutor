name: agent-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests (agent core)
        run: python -m pytest tests/test_agent_state.py tests/test_auto_decode.py tests/test_challenge_fetch.py tests/test_agent_security_research.py -q
      - name: Eval smoke
        run: python -m agent.eval_agent
